name: CI

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: podcasts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d podcasts_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/podcasts_test
          API_KEY: ${{ vars.TEST_API_KEY }}
          ITUNES_BASE_URL: https://itunes.apple.com
        run: uv run alembic upgrade head

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/podcasts_test
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/podcasts_test
          API_KEY: ${{ vars.TEST_API_KEY }}
          ITUNES_BASE_URL: https://itunes.apple.com
        run: uv run pytest -v